name: Amazon Egypt Price Tracker

on:
  schedule:
    # يعمل تلقائياً كل ساعتين
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run price tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      - name: Save updated price history
        run: |
          git config user.name "PriceTrackerBot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json products.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Update price history and products"
            git pull --rebase origin main
            git push
          fi
