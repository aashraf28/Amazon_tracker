name: Amazon EG Price Tracker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan mode (manual, auto, or single)'
        required: false
        default: 'manual'
      target_asin:
        description: 'Specific ASIN for fast single-item scan'
        required: false
        default: ''

concurrency:
  group: amazon-price-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Amazon session cookies
        uses: actions/cache@v4
        with:
          path: session_state.json
          key: amazon-session-${{ github.run_id }}
          restore-keys: |
            amazon-session-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --quiet requests playwright playwright-stealth
          if [ -x /usr/bin/google-chrome ]; then
            echo "Pre-installed Google Chrome found. Skipping download."
          else
            for i in 1 2 3; do
              playwright install chrome && break || sleep 5
            done
          fi

      - name: Run price tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_MODE: ${{ github.event.inputs.mode || 'schedule' }}
          TARGET_ASIN: ${{ github.event.inputs.target_asin || '' }}
        run: python tracker.py

      - name: Commit changes only if prices or products updated
        run: |
          if [ -n "$(git status --porcelain products.json history.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add products.json history.json
            git commit -m "Update price history [skip ci]"
            git pull --rebase -X ours origin main || (git rebase --abort && git pull --no-rebase --no-edit -X ours origin main)
            git push
          else
            echo "No price or status changes detected. Skipping commit."
          fi
